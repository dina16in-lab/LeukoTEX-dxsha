<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_14 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_14" style="display:block;"><svg viewbox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="logoGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#ffffff"></stop>
<stop offset="100%" stop-color="#cccccc"></stop>
</lineargradient>
</defs>
<g fill="none" stroke="url(#logoGrad)" stroke-width="4">
<!-- Outer technical path -->
<path d="M100 100 L300 100 L300 300 L100 300 Z">
<animate attributename="stroke-dasharray" dur="3s" fill="freeze" from="0, 800" to="800, 0"></animate>
</path>
<!-- Abstract 'L' construction -->
<path d="M150 150 L150 250 L250 250" stroke-linecap="round" stroke-width="8">
<animate attributename="stroke-dashoffset" dur="2s" fill="freeze" from="300" to="0"></animate>
<animate attributename="stroke-dasharray" dur="2s" fill="freeze" from="300" to="300"></animate>
</path>
<!-- Animated data nodes -->
<circle cx="150" cy="150" fill="#ffffff" r="6">
<animate attributename="r" dur="2s" repeatcount="indefinite" values="6;8;6"></animate>
<animate attributename="opacity" dur="2s" repeatcount="indefinite" values="1;0.5;1"></animate>
</circle>
<circle cx="250" cy="250" fill="#ffffff" r="6">
<animate attributename="r" dur="2s" repeatcount="indefinite" values="6;8;6"></animate>
<animate attributename="opacity" begin="1s" dur="2s" repeatcount="indefinite" values="1;0.5;1"></animate>
</circle>
</g>
<text fill="#ffffff" font-family="Sora, sans-serif" font-size="24" font-weight="700" style="letter-spacing: 4px;" text-anchor="middle" x="200" y="360">
    LEUKOTEX
    <animate attributename="opacity" dur="2s" fill="freeze" values="0;1"></animate>
</text>
</svg></div><!-- STITCH_SVG_END:ANIMATION_14 -->
</body>
</html>
