<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_18 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_18" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_18');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container-ANIMATION_18');
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);

  const spotLight = new THREE.SpotLight(0xffffff, 1.5);
  spotLight.position.set(5, 5, 5);
  scene.add(spotLight);

  const pointLight = new THREE.PointLight(0x00aaff, 1, 10);
  pointLight.position.set(-2, -2, 2);
  scene.add(pointLight);

  // Abstract Geometric "L" Construction in 3D
  const logoGroup = new THREE.Group();

  const metalMat = new THREE.MeshPhongMaterial({ 
    color: 0x333333, 
    specular: 0x999999, 
    shininess: 100 
  });

  const glowMat = new THREE.MeshBasicMaterial({ color: 0x00aaff });

  // vertical bar
  const vBarGeom = new THREE.BoxGeometry(0.5, 2.5, 0.5);
  const vBar = new THREE.Mesh(vBarGeom, metalMat);
  vBar.position.set(-0.5, 0, 0);
  logoGroup.add(vBar);

  // horizontal bar
  const hBarGeom = new THREE.BoxGeometry(2, 0.5, 0.5);
  const hBar = new THREE.Mesh(hBarGeom, metalMat);
  hBar.position.set(0.25, -1, 0);
  logoGroup.add(hBar);

  // Accent glow nodes
  const nodeGeom = new THREE.SphereGeometry(0.15, 16, 16);
  const node1 = new THREE.Mesh(nodeGeom, glowMat);
  node1.position.set(-0.5, 1.25, 0.3);
  logoGroup.add(node1);

  const node2 = new THREE.Mesh(nodeGeom, glowMat);
  node2.position.set(1.25, -1, 0.3);
  logoGroup.add(node2);

  scene.add(logoGroup);
  camera.position.z = 5;

  // Animation
  let mouseX = 0;
  let mouseY = 0;

  window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
  });

  const animate = () => {
    requestAnimationFrame(animate);
    
    logoGroup.rotation.y += (mouseX * 0.5 - logoGroup.rotation.y) * 0.05;
    logoGroup.rotation.x += (-mouseY * 0.3 - logoGroup.rotation.x) * 0.05;
    
    // Subtle float
    logoGroup.position.y = Math.sin(Date.now() * 0.001) * 0.15;
    
    renderer.render(scene, camera);
  };

  animate();

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_18 -->
</body>
</html>
