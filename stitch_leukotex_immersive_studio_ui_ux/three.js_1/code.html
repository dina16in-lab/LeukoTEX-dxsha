<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_15 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_15" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_15');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
scene.scene.add(ambientLight);

const spotLight = new THREE.SpotLight(0xffffff, 2);
spotLight.position.set(10, 10, 10);
scene.add(spotLight);

const pointLight = new THREE.PointLight(0x4488ff, 1, 10);
pointLight.position.set(-5, -2, 5);
scene.add(pointLight);

// Original Robotic Character Construction (Head/Bust)
const robotGroup = new THREE.Group();

// Main Helmet/Head
const helmetGeom = new THREE.SphereGeometry(1, 32, 32, 0, Math.PI * 2, 0, Math.PI * 0.8);
const metalMat = new THREE.MeshPhongMaterial({ 
    color: 0x222222, 
    specular: 0x888888, 
    shininess: 100 
});
const helmet = new THREE.Mesh(helmetGeom, metalMat);
robotGroup.add(helmet);

// Visor
const visorGeom = new THREE.SphereGeometry(1.02, 32, 32, 0, Math.PI, Math.PI * 0.3, Math.PI * 0.3);
const visorMat = new THREE.MeshPhongMaterial({ 
    color: 0x050505, 
    specular: 0xffffff, 
    shininess: 200,
    transparent: true,
    opacity: 0.9
});
const visor = new THREE.Mesh(visorGeom, visorMat);
robotGroup.add(visor);

// Neck/Mechanical Core
const neckGeom = new THREE.CylinderGeometry(0.4, 0.6, 0.8, 16);
const neck = new THREE.Mesh(neckGeom, metalMat);
neck.position.y = -1.2;
robotGroup.add(neck);

// Internal blue glow
const coreGeom = new THREE.CylinderGeometry(0.3, 0.3, 0.6, 16);
const coreMat = new THREE.MeshBasicMaterial({ color: 0x00aaff });
const core = new THREE.Mesh(coreGeom, coreMat);
core.position.y = -1.2;
robotGroup.add(core);

scene.add(robotGroup);
camera.position.z = 4;

// Animation loop
let mouseX = 0;
let mouseY = 0;

window.addEventListener('mousemove', (event) => {
    mouseX = (event.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
});

const animate = () => {
    requestAnimationFrame(animate);
    
    // Subtle float
    robotGroup.position.y = Math.sin(Date.now() * 0.001) * 0.1;
    
    // Look at mouse
    robotGroup.rotation.y += (mouseX * 0.3 - robotGroup.rotation.y) * 0.05;
    robotGroup.rotation.x += (-mouseY * 0.2 - robotGroup.rotation.x) * 0.05;
    
    renderer.render(scene, camera);
};

animate();

// Handle resize
window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_15 -->
</body>
</html>
